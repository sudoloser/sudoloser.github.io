name: Sync redirects

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ds

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - id: autocommit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: sync repo redirects'
          file_pattern: public/r/
          branch: ds

      - name: Trigger build and deploy workflow
        if: steps.autocommit.outputs.changes_detected == 'true' || github.event_name == 'workflow_dispatch'
        run: gh workflow run "Build and deploy" --ref ds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
